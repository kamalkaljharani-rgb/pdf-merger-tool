<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support — ExpressPDF</title>
  <link rel="canonical" href="https://expresspdf.in/contact">
  <link rel="icon" type="image/png" href="favicon-32x32_expresspdf.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9655000139100416"
     crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-200 bg-white sticky top-0 z-30 shadow-sm">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4 sm:px-6">
      <a href="index.html" class="flex items-center gap-2.5">
        <img src="logo_expresspdf.png" alt="ExpressPDF Logo" class="h-8 w-auto object-contain">
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium text-slate-600">
        <a class="transition hover:text-red-600" href="index.html">Home</a>
        <a class="transition hover:text-red-600" href="merge_pdf.html">Merge</a>
        <a class="transition hover:text-red-600" href="guide.html">Guide</a>
        <a class="transition hover:text-red-600" href="faq.html">FAQ</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-xl mx-auto w-full px-4 py-10">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-3 text-center">Contact Support</h1>
    <p class="text-slate-600 text-center text-sm mb-8">Have feedback, suggestions, or technical questions about ExpressPDF? Send us a message.</p>

    <div class="bg-white border border-slate-200/80 rounded-2xl p-6 sm:p-8 shadow-sm">
      <form action="https://formspree.io/f/mnpqgqwr" method="POST" class="space-y-4">
  <div>
    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Your Name</label>
    <input type="text" name="name" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-red-600">
  </div>
  <div>
    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Email Address</label>
    <input type="email" name="email" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-red-600">
  </div>
  <div>
    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Message</label>
    <textarea name="message" rows="4" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-red-600"></textarea>
  </div>
  <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition">
    Send Message
  </button>
</form>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <div class="flex justify-center gap-6 mb-2">
      <a href="privacy.html" class="hover:text-slate-900">Privacy Policy</a>
      <a href="terms.html" class="hover:text-slate-900">Terms of Service</a>
      <a href="contact.html" class="text-red-600 font-bold">Contact Support</a>
    </div>
    <p>© 2026 ExpressPDF. All processing happens in your browser.</p>
  </footer>

</body>
</html>
